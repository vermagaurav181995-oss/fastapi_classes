services:
  - type: web
    name: my-capstone-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: fastapi run main.py --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: '["https://your-frontend.example.com"]'
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
