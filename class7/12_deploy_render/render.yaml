services:
  - type: web
    name: fastapi-bookstore
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: fastapi run main.py --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: '["https://myapp.com"]'
