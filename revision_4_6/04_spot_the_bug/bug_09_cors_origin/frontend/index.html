<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookshop frontend</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 36rem; margin: 2rem auto; padding: 0 1rem; }
    button { font: inherit; padding: .4rem 1rem; }
    pre { background: #f3f3f3; padding: 1rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Bookshop</h1>
  <button id="load">Load books from the API</button>
  <pre id="output">Click the button.</pre>
  <script>
    document.getElementById("load").addEventListener("click", async () => {
      const output = document.getElementById("output");
      try {
        const response = await fetch("http://127.0.0.1:8000/books");
        output.textContent = JSON.stringify(await response.json(), null, 2);
      } catch (error) {
        output.textContent = "Request failed: " + error + "\nOpen DevTools (F12) and check the Console.";
      }
    });
  </script>
</body>
</html>
